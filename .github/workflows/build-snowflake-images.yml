name: Publish Snowflake image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-snow'
jobs:
  push_to_snowflake:
    name: Push Docker image to Snowflake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5
      - name: Log in to Snowflake image registry
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: snow spcs image-registry login -x
      - name: Decode Snowflake license
        env:
          LICENSE_B64: ${{ secrets.SNOWFLAKE_LICENSE_B64 }}
        run: |
          if [ -z "$LICENSE_B64" ]; then
            echo "::error::SNOWFLAKE_LICENSE_B64 is not set"; exit 1
          fi
          echo "$LICENSE_B64" | base64 -d > snowflake/Implem.License.dll
      - name: Build CodeDefiner
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: |
          docker build --platform linux/amd64 \
            -f snowflake/Dockerfile.codedefiner \
            -t "$REPO/pleasanter:codedefiner" \
            snowflake
      - name: Scan CodeDefiner
        uses: ./.github/actions/scan-image
        with:
          image: ${{ vars.SNOWFLAKE_IMAGE_REPO }}/pleasanter:codedefiner
      - name: Push CodeDefiner
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: docker push "$REPO/pleasanter:codedefiner"
      - name: Build Pleasanter
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: |
          docker build --platform linux/amd64 \
            -f snowflake/Dockerfile \
            -t "$REPO/pleasanter:latest" \
            snowflake
      - name: Scan Pleasanter
        uses: ./.github/actions/scan-image
        with:
          image: ${{ vars.SNOWFLAKE_IMAGE_REPO }}/pleasanter:latest
      - name: Push Pleasanter
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: docker push "$REPO/pleasanter:latest"
      - name: Remove Snowflake license
        if: always()
        run: rm -f snowflake/Implem.License.dll
