name: Publish Docker image

# TEST: 個人 Fork でのワークフロー全体テスト用の一時編集（Git で revert 前提）。本番へはマージしない。
on:
  workflow_dispatch:                       # TEST: 本番は release: published
    inputs:
      version:
        description: "Image version tag"
        default: "0.0.0-test"
        required: true

env:
  DH_IMAGE: implemokada/pleasanter         # TEST: 本番は implem/pleasanter

jobs:
  push_to_snowflake:
    name: Build and push images to Snowflake (SPCS, dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5
      - name: Log in to Snowflake image registry
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: snow spcs image-registry login -x
      - name: Decode Snowflake license
        env:
          LICENSE_B64: ${{ secrets.SNOWFLAKE_LICENSE_B64 }}
        run: |
          if [ -z "$LICENSE_B64" ]; then
            echo "::error::SNOWFLAKE_LICENSE_B64 is not set"; exit 1
          fi
          umask 077
          echo "$LICENSE_B64" | base64 -d > snowflake/docker/Implem.License.dll
          chmod 600 snowflake/docker/Implem.License.dll
      - name: Build CodeDefiner (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: |
          docker build --platform linux/amd64 \
            -f snowflake/docker/Dockerfile.codedefiner \
            -t "$REPO/pleasanter:codedefiner" \
            snowflake/docker
      - name: Scan CodeDefiner (SPCS)
        uses: ./.github/actions/scan-image
        with:
          image: ${{ vars.SNOWFLAKE_IMAGE_REPO }}/pleasanter:codedefiner
          category: snowflake-codedefiner
      - name: Push CodeDefiner (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: docker push "$REPO/pleasanter:codedefiner"
      - name: Build Pleasanter (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: |
          docker build --platform linux/amd64 \
            -f snowflake/docker/Dockerfile \
            -t "$REPO/pleasanter:latest" \
            snowflake/docker
      - name: Scan Pleasanter (SPCS)
        uses: ./.github/actions/scan-image
        with:
          image: ${{ vars.SNOWFLAKE_IMAGE_REPO }}/pleasanter:latest
          category: snowflake-pleasanter
      - name: Push Pleasanter (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: docker push "$REPO/pleasanter:latest"
      - name: Remove Snowflake license
        if: always()
        run: rm -f snowflake/docker/Implem.License.dll
