name: Publish Docker image

# TEST: 個人 Fork でのワークフロー全体テスト用の一時編集（Git で revert 前提）。本番へはマージしない。
on:
  workflow_dispatch:                       # TEST: 本番は release: published
    inputs:
      version:
        description: "Image version tag"
        default: "0.0.0-test"
        required: true

env:
  DH_IMAGE: implemokada/pleasanter         # TEST: 本番は implem/pleasanter

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Split tag name
        id: split
        run: echo "RELEASEVER=${{ inputs.version }}" >> "$GITHUB_OUTPUT"   # TEST: 本番は release.tag_name から ##Pleasanter_ 除去
      - name: Test variable
        run: |
          echo ${{ steps.split.outputs.RELEASEVER }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx          # TEST: 本番は cloud ドライバ（Build Cloud）。Fork では既定 docker-container（amd64 のみ＝QEMU 不要）
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata (Pleasanter)
        id: meta1
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DH_IMAGE }}       # TEST: 本番は implem/pleasanter
          tags: |
            latest
            ${{ steps.split.outputs.RELEASEVER }}
      - name: Build for scan (Pleasanter)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Implem.Pleasanter/Dockerfile
          platforms: linux/amd64
          load: true
          tags: implem/pleasanter:scan-pleasanter
      - name: Scan image (Pleasanter)
        uses: ./.github/actions/scan-image
        with:
          image: implem/pleasanter:scan-pleasanter
          category: pleasanter
      - name: Build and push (Pleasanter)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Implem.Pleasanter/Dockerfile
          platforms: linux/amd64            # TEST: 本番は linux/amd64,linux/arm64（arm64 カット）
          push: true
          tags: ${{ steps.meta1.outputs.tags }}
      - name: Extract metadata (CodeDefiner)
        id: meta2
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DH_IMAGE }}       # TEST: 本番は implem/pleasanter
          tags: codedefiner
      - name: Build for scan (CodeDefiner)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Implem.CodeDefiner/Dockerfile
          platforms: linux/amd64
          load: true
          tags: implem/pleasanter:scan-codedefiner
      - name: Scan image (CodeDefiner)
        uses: ./.github/actions/scan-image
        with:
          image: implem/pleasanter:scan-codedefiner
          category: codedefiner
      - name: Build and push (CodeDefiner)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Implem.CodeDefiner/Dockerfile
          platforms: linux/amd64            # TEST: 本番は linux/amd64,linux/arm64（arm64 カット）
          push: true
          tags: ${{ steps.meta2.outputs.tags }}
  push_to_snowflake:
    name: Build and push images to Snowflake (SPCS, dev)
    needs: push_to_registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5
      - name: Log in to Snowflake image registry
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: snow spcs image-registry login -x
      - name: Decode Snowflake license
        env:
          LICENSE_B64: ${{ secrets.SNOWFLAKE_LICENSE_B64 }}
        run: |
          if [ -z "$LICENSE_B64" ]; then
            echo "::error::SNOWFLAKE_LICENSE_B64 is not set"; exit 1
          fi
          umask 077
          echo "$LICENSE_B64" | base64 -d > snowflake/docker/Implem.License.dll
          chmod 600 snowflake/docker/Implem.License.dll
      - name: Build CodeDefiner (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: |
          docker build --platform linux/amd64 \
            -f snowflake/docker/Dockerfile.codedefiner \
            -t "$REPO/pleasanter:codedefiner" \
            snowflake/docker
      - name: Scan CodeDefiner (SPCS)
        uses: ./.github/actions/scan-image
        with:
          image: ${{ vars.SNOWFLAKE_IMAGE_REPO }}/pleasanter:codedefiner
          category: snowflake-codedefiner
      - name: Push CodeDefiner (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: docker push "$REPO/pleasanter:codedefiner"
      - name: Build Pleasanter (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: |
          docker build --platform linux/amd64 \
            -f snowflake/docker/Dockerfile \
            -t "$REPO/pleasanter:latest" \
            snowflake/docker
      - name: Scan Pleasanter (SPCS)
        uses: ./.github/actions/scan-image
        with:
          image: ${{ vars.SNOWFLAKE_IMAGE_REPO }}/pleasanter:latest
          category: snowflake-pleasanter
      - name: Push Pleasanter (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: docker push "$REPO/pleasanter:latest"
