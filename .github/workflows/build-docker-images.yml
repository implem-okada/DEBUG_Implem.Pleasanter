name: Publish Docker image

on:
  release:
    types: [published]
jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Split tag name
        env:
          RELEASETAG: ${{ github.event.release.tag_name }}
        id: split
        run: echo "RELEASEVER=${RELEASETAG##Pleasanter_}" >> "$GITHUB_OUTPUT"
      - name: Test variable
        run: |
          echo ${{ steps.split.outputs.RELEASEVER }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: "lab:latest"
          driver: cloud
          endpoint: "implem/pleasanter-release-builder"
      - name: Extract metadata (Pleasanter)
        id: meta1
        uses: docker/metadata-action@v5
        with:
          images: implem/pleasanter
          tags: |
            latest
            ${{ steps.split.outputs.RELEASEVER }}
      - name: Build and push (Pleasanter)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Implem.Pleasanter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta1.outputs.tags }}
      - name: Extract metadata (CodeDefiner)
        id: meta2
        uses: docker/metadata-action@v5
        with:
          images: implem/pleasanter
          tags: codedefiner
      - name: Build and push (CodeDefiner)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Implem.CodeDefiner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta2.outputs.tags }}
  push_to_snowflake:
    name: Build and push images to Snowflake (SPCS, dev)
    # Docker Hub のベースイメージ（implem/pleasanter:latest / :codedefiner）が
    # push された後に実行する。Snowflake 用イメージはこれらを FROM するため。
    needs: push_to_registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      # ベースイメージ pull 時の Docker Hub 匿名レート制限を回避する。
      # push_to_registry とは別ランナーのため、改めてログインが必要。
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5
      # JWT（キーペア）認証の一時接続(-x)で docker をレジストリにログインさせる。
      # 内部で docker login を実行し ~/.docker/config.json に資格情報を書き込む。
      - name: Log in to Snowflake image registry
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          # 秘密鍵が暗号化されている場合のみ次行を有効化する:
          # PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: snow spcs image-registry login -x
      # ランナーは amd64 のため --platform linux/amd64 はネイティブビルド（buildx/cloud 不要）。
      - name: Build and push CodeDefiner (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: |
          docker build --platform linux/amd64 \
            -f snowflake/docker/Dockerfile.codedefiner \
            -t "$REPO/pleasanter:codedefiner" \
            snowflake/docker
          docker push "$REPO/pleasanter:codedefiner"
      - name: Build and push Pleasanter (SPCS)
        env:
          REPO: ${{ vars.SNOWFLAKE_IMAGE_REPO }}
        run: |
          docker build --platform linux/amd64 \
            -f snowflake/docker/Dockerfile \
            -t "$REPO/pleasanter:latest" \
            snowflake/docker
          docker push "$REPO/pleasanter:latest"
